name: Setup pnpm workspace
description: Configure Node/pnpm caching and install the frozen workspace without lifecycle fan-out
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
  pnpm-version:
    description: pnpm version
    required: false
    default: '11.10.0'
  filter:
    description: Optional pnpm filter including dependency closure
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      with:
        version: ${{ inputs.pnpm-version }}
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install filtered workspace
      shell: bash
      env:
        PNPM_FILTER: ${{ inputs.filter }}
      run: |
        if [[ -n "$PNPM_FILTER" ]]; then
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts --filter "$PNPM_FILTER"
        else
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
        fi

    # Root-level qualification tests import workspace packages by name (the MQTT
    # recovery gate forks a worker that does `import('@totemsdk/edge-mqtt')`).
    # A filtered install only links a package into its dependents, so link every
    # workspace package into the repo root as well.
    - name: Link workspace packages at the repo root
      shell: bash
      run: |
        mkdir -p node_modules/@totemsdk
        for manifest in packages/*/package.json; do
          dir=$(dirname "$manifest")
          name=$(node -p "require('./$manifest').name")
          case "$name" in
            @totemsdk/*) ln -sfn "$PWD/$dir" "node_modules/$name" ;;
          esac
        done

    # `--ignore-scripts` skips lifecycle scripts for ALL packages, including the
    # native deps that need compiling. Without this, better-sqlite3 ships no
    # prebuilt binding on the runner and every sqlite-backed package (storage,
    # agent-policy, lookup-node, omnia-host) fails its test gate with
    # "Could not locate the bindings file".
    #
    # `pnpm rebuild <pkg>` (non-recursive) is a no-op for transitive deps; the
    # recursive form with an explicit package name force-runs only that dep's
    # install script (prebuild-install || node-gyp rebuild). Without the name,
    # `-r` also runs every workspace package's `prepare`, which fails for
    # packages whose deps are absent in this filtered workspace (e.g. mcp-server).
    - name: Rebuild native dependencies
      shell: bash
      run: pnpm rebuild -r better-sqlite3
