name: Verify package release
description: Build dependency closure, test, and validate a package tarball as a clean consumer
inputs:
  package-name:
    description: Workspace package name
    required: true
  package-dir:
    description: Package directory
    required: true
runs:
  using: composite
  steps:
    - name: Build dependency closure
      shell: bash
      run: pnpm --filter "${{ inputs.package-name }}..." run build
    - name: Run package tests
      shell: bash
      run: pnpm --filter "${{ inputs.package-name }}" test
    - name: Build MQTT WASM artifacts
      if: inputs.package-name == '@totemsdk/edge-mqtt'
      shell: bash
      working-directory: packages/edge-mqtt
      run: npm run build:wasm
    - name: Verify MQTT process recovery and packed binding
      if: inputs.package-name == '@totemsdk/edge-mqtt'
      shell: bash
      run: |
        pnpm --filter @totemsdk/edge-mqtt test:recovery
        pnpm --filter @totemsdk/edge-mqtt test:consumer
        pnpm --filter @totemsdk/edge-mqtt test:conformance
    - name: Verify packed consumer
      shell: bash
      run: node scripts/verify-consumer-pack.mjs "${{ inputs.package-dir }}"
    - name: Verify MCP packed artifact
      if: inputs.package-name == '@totemsdk/mcp-server'
      shell: bash
      run: node scripts/verify-mcp-pack.mjs
