name: Setup Rust WASM toolchain
description: Install Rust, wasm32 target, wasm-pack, and cache compiled dependencies
inputs:
  cache-key:
    description: Additional cache-key segment
    required: false
    default: workspace
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: 1.97.0
        targets: wasm32-unknown-unknown
    - name: Cache Rust and WASM artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          packages/**/target
          packages/**/rust/pkg
          packages/**/rust/pkg-node
        # Shallow globs only: `packages/**/Cargo.lock` traverses the installed
        # node_modules trees and can exceed the 120s template-evaluation limit
        # ("hashFiles(...) couldn't finish within 120 seconds"), failing the job.
        # Locks live at packages/<pkg>/{rust/,}Cargo.lock.
        key: ${{ runner.os }}-rust-wasm-${{ inputs.cache-key }}-${{ hashFiles('packages/*/rust/Cargo.lock', 'packages/*/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-wasm-${{ inputs.cache-key }}-
          ${{ runner.os }}-rust-wasm-
    - name: Install wasm-pack
      shell: bash
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Verify pinned wasm-pack version (RFC-031 P3)
      shell: bash
      run: |
        actual="$(wasm-pack --version | awk '{print $2}')"
        if [ "$actual" != "0.15.0" ]; then
          echo "::error::wasm-pack version drift: expected 0.15.0, got $actual"
          exit 1
        fi
