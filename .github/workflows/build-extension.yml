name: Build Totem Extension

on:
  push:
    branches: [main]
    paths:
      - 'extensions/totem-extension/**'
      - '.github/workflows/build-extension.yml'
  # Publishing a Release tagged `extension-v*` is the approval gate: it builds,
  # signs, and attaches the fixed-name assets that totem.ing's download CTA
  # resolves through `releases/latest/download/`. Mirrors the packages' model in
  # publish-totemsdk.yml (release: types: [published]).
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      # The extension consumes @totemsdk/* workspace packages (workspace:^),
      # whose compiled dist/ is gitignored and so must be built here (webpack
      # resolves into those dist/ files).
      #
      # Build the packages the extension actually imports, NOT its full
      # dependency closure: the closure pulls in @totemsdk/omnia → tx-builder,
      # whose dist build needs a gitignored Rust/wasm-pack artifact and whose
      # code the extension never bundles. @totemsdk/core-wasm is likewise
      # excluded — its pkg/ artifacts are committed and its build requires
      # wasm-pack (and would rewrite the committed WASM nondeterministically).
      - name: Build extension's SDK dependencies
        run: |
          pnpm \
            --filter @totemsdk/core \
            --filter @totemsdk/txpow \
            --filter @totemsdk/connect \
            --filter @totemsdk/realtime \
            --filter @totemsdk/chain-provider \
            --filter @totemsdk/wots-lease \
            --filter @totemsdk/root-identity \
            --filter @totemsdk/storage \
            --filter @totemsdk/minima-rpc \
            --filter @totemsdk/lookup-protocol \
            run build

      - name: Build extension
        run: npm run build
        working-directory: extensions/totem-extension

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(node -p "require('./extensions/totem-extension/dist/manifest.json').version")
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extension version: ${VERSION}"

      # Fixed-name artifacts (`totem-extension.zip` / `.crx`) are what the
      # website links to via github.com/.../releases/latest/download/<name>.
      # Version-stamped copies are kept alongside for auditing.
      - name: Package extension (zip + signed crx3 + update XML)
        env:
          # PEM private key used to sign the CRX. MUST stay stable across
          # releases or Chrome treats each build as a different extension and
          # will not offer in-place updates. Generate once with `npx crx3` and
          # store the PEM contents as this secret.
          EXTENSION_CRX_KEY: ${{ secrets.EXTENSION_CRX_KEY }}
        run: |
          set -euo pipefail
          cd extensions/totem-extension
          VERSION="${{ steps.version.outputs.value }}"
          OUT="$GITHUB_WORKSPACE"
          CRX_URL="https://github.com/Totem-Edge/totem-sdk/releases/latest/download/totem-extension.crx"

          KEYFILE="$RUNNER_TEMP/extension-key.pem"
          if [ -n "${EXTENSION_CRX_KEY:-}" ]; then
            printf '%s' "$EXTENSION_CRX_KEY" > "$KEYFILE"
            echo "Signing with the configured EXTENSION_CRX_KEY."
            # Pin the extension ID in the built manifest (dist/ only; the source
            # manifest stays key-free). The `key` is the public half of the
            # signing key — safe to ship — and makes the unpacked and .crx
            # install paths share one ID, which updates and policies require.
            node scripts/set-manifest-key.js "$KEYFILE" --manifest dist/manifest.json
            echo "Extension ID: $(node scripts/print-extension-id.js "$KEYFILE")"
          else
            echo "::warning::EXTENSION_CRX_KEY is not set — generating an ephemeral key. The resulting .crx will not support in-place updates and the ID will change per build; set the secret to fix this."
          fi

          # Signed CRX3 + plain ZIP, plus the update-manifest XML used by
          # enterprise policy (ExtensionInstallForcelist) and off-store updates.
          npx --yes crx3@2 \
            -p "$KEYFILE" \
            -o "$OUT/totem-extension.crx" \
            -z "$OUT/totem-extension.zip" \
            -x "$OUT/totem-extension.xml" \
            --appVersion "$VERSION" \
            --crxURL "$CRX_URL" \
            -- dist

          cp "$OUT/totem-extension.zip" "$OUT/totem-extension-v${VERSION}.zip"
          cp "$OUT/totem-extension.crx" "$OUT/totem-extension-v${VERSION}.crx"

          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          cp "$OUT/totem-extension.zip" "$OUT/totem-extension-build-${TIMESTAMP}.zip"

          ( cd "$OUT" && sha256sum \
              totem-extension.zip \
              totem-extension-v${VERSION}.zip \
              totem-extension.crx \
              totem-extension-v${VERSION}.crx > SHA256SUMS.txt )
          echo "--- SHA256SUMS.txt ---"
          cat "$OUT/SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: totem-extension
          path: |
            totem-extension.zip
            totem-extension.crx
            totem-extension.xml
            totem-extension-v*.zip
            totem-extension-v*.crx
            SHA256SUMS.txt
            totem-extension-build-*.zip
          retention-days: 90

      # Publishing the Release IS the approval: only `extension-v<version>`
      # (a published Release) attaches the fixed-name assets.
      - name: Create release and upload
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        if: startsWith(github.event.release.tag_name, 'extension-v') || startsWith(github.ref, 'refs/tags/extension-v')
        with:
          files: |
            totem-extension.zip
            totem-extension.crx
            totem-extension.xml
            totem-extension-v*.zip
            totem-extension-v*.crx
            SHA256SUMS.txt
          generate_release_notes: true
