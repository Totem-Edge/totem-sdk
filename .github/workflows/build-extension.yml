name: Build Totem Extension

on:
  push:
    branches: [main]
    paths:
      - 'extensions/totem-extension/**'
      - '.github/workflows/build-extension.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/totem-extension/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: extensions/totem-extension

      - name: Build extension
        run: npm run build
        working-directory: extensions/totem-extension

      - name: Package extension as zip
        run: |
          cd extensions/totem-extension
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          ZIPNAME="totem-extension-build-${TIMESTAMP}.zip"
          cd dist && zip -r "../../../${ZIPNAME}" .
          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: totem-extension
          path: totem-extension-build-*.zip
          retention-days: 90

      - name: Create release and upload
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: startsWith(github.ref, 'refs/tags/extension-v')
        with:
          files: totem-extension-build-*.zip
          generate_release_notes: true
