name: Dist-tag migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the commands; apply changes npm dist-tags"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      package:
        description: "Optional: promote one package instead of syncing channel tags"
        required: false
        default: ""
        type: string
      version:
        description: "Version to promote (required with package)"
        required: false
        default: ""
        type: string
      tag:
        description: "Dist-tag to apply (required with package)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: Apply RFC-063 dist-tags
    runs-on: ubuntu-latest
    environment:
      name: npm-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify npm identity
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Plan or apply dist-tags
        run: |
          TARGET_ARGS=""
          if [ -n "${{ inputs.package }}" ]; then
            TARGET_ARGS="--package ${{ inputs.package }} --version ${{ inputs.version }} --tag ${{ inputs.tag }}"
          fi
          if [ "${{ inputs.mode }}" = "apply" ]; then
            node scripts/apply-dist-tags.mjs $TARGET_ARGS --execute
          else
            node scripts/apply-dist-tags.mjs $TARGET_ARGS
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify final tags
        if: inputs.mode == 'apply'
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            node scripts/report-dist-tags.mjs --check --package "${{ inputs.package }}"
          else
            node scripts/report-dist-tags.mjs --check
          fi
