name: Dist-tag migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the commands; apply changes npm dist-tags"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

jobs:
  apply:
    name: Apply RFC-063 dist-tags
    runs-on: ubuntu-latest
    environment:
      name: npm-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify npm identity
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Plan or apply dist-tags
        run: node scripts/apply-dist-tags.mjs ${{ inputs.mode == 'apply' && '--execute' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify final tags
        if: inputs.mode == 'apply'
        run: node scripts/report-dist-tags.mjs --check
