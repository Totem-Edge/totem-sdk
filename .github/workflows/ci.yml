name: Workspace CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  install:
    name: Frozen lockfile install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Verify working tree clean after install
        run: |
          git status --short
          test -z "$(git status --porcelain)" || (echo "install modified the working tree" && exit 1)

  typecheck-build:
    name: Typecheck and build (TypeScript packages)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: WASM provenance — committed pkg/pkg-node/pkg-web must match source (RFC-018 P2-5, RFC-031)
        run: |
          if ! git diff --exit-code -- packages/core-wasm/pkg packages/core-wasm/pkg-node packages/core-wasm/pkg-web; then
            echo "::error::committed core-wasm artifacts are stale; run 'npm run build' in packages/core-wasm and commit the result"
            exit 1
          fi
      - name: WASM artifact hash provenance (RFC-031 P3)
        working-directory: packages/core-wasm
        run: npm run artifacts:verify
      - name: SBOM up to date (RFC-031 P3)
        run: |
          (cd packages/core-wasm && npm run sbom:write)
          if ! git diff --exit-code -- packages/core-wasm/sbom.json; then
            echo "::error::sbom.json is stale; run 'npm run sbom:write' in packages/core-wasm and commit the result"
            exit 1
          fi
      - name: Edge size/cold-start budgets (RFC-031 G4)
        working-directory: packages/core-wasm
        run: npm run budgets:check
      - name: Typecheck + build (workspace)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: QVAC API drift audit (against real @qvac/sdk)
        run: node scripts/verify-qvac-api-drift.mjs --strict
      - name: MCP catalog parity gate
        run: node scripts/verify-mcp-index.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Rebuild native sqlite bindings (install uses --ignore-scripts)
        run: pnpm -r rebuild better-sqlite3
      - name: Run unit tests (workspace)
        env:
          SKIP_PREREQUISITE_BUILD: '1'
        run: node scripts/verify-workspace.mjs --test
      - name: Core async WASM entry + kernel coverage + fuzz (RFC-031 P1/P2)
        working-directory: packages/core
        run: npm run test:wasm-async
      - name: core-wasm portable web target (RFC-031 G1)
        working-directory: packages/core-wasm
        run: npm run test:web

  omnia-parity:
    name: Omnia Rust/WASM parity
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace dependencies (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Run Omnia parity tests (builds WASM first)
        working-directory: packages/omnia
        run: npm run test:parity
      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt
      - name: cargo fmt --check (omnia)
        run: cargo fmt --manifest-path packages/omnia/rust/Cargo.toml -- --check
      - name: cargo clippy (omnia, -D warnings)
        run: cargo clippy --all-targets --all-features --manifest-path packages/omnia/rust/Cargo.toml -- -D warnings
      - name: Run Omnia Rust tests
        run: cargo test --all-targets --all-features --manifest-path packages/omnia/rust/Cargo.toml

  lint:
    name: Lint + script hygiene
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Run lint gate
        run: node scripts/verify-workspace.mjs --lint
      - name: Validate npm metadata
        run: node scripts/validate-pkg-meta.mjs
      - name: Validate SDK_MANIFEST sync
        run: node scripts/verify-sdk-manifest.mjs
      - name: storage→core DAG lint
        run: node scripts/verify-storage-dag.mjs
      - name: Wallet ⇄ connect parity audit (anti-drift)
        run: node scripts/audit-wallet-connect-parity.mjs --check

  storage-durability:
    name: Storage durable-CI (sqlite + fs + artifact conformance)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Rebuild native sqlite bindings (install uses --ignore-scripts)
        run: pnpm -r rebuild better-sqlite3
      - name: Fail if better-sqlite3 cannot run
        working-directory: packages/storage
        run: node -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3 OK')"
      - name: Run sqlite + fs KV conformance (durable gates)
        working-directory: packages/storage
        run: npx jest --testPathPatterns="sqlite-store.conformance|file-store.conformance"
      # RFC-007 Amendment A (A2): artifact durable gates. The reference backend
      # conformance is `runBackendConformance` in @totemsdk/storage (LocalFileBackend);
      # the Edge cache and ProofGraph consume it rather than re-declaring a suite.
      - name: Reference artifact backend conformance (LocalFileBackend)
        working-directory: packages/storage
        run: npx jest --testPathPatterns="artifact-store" --runInBand
      - name: Persistence helper contract (assertPersistence)
        working-directory: packages/storage
        run: npx jest persistence --runInBand
      - name: Edge artifact cache conformance (first consumer)
        working-directory: packages/edge-adapters
        run: npx jest artifact-cache --runInBand
      - name: ProofGraph evidence conformance (reference ArtifactStore consumer)
        working-directory: packages/proofgraph
        run: npx jest evidence --runInBand

  pack:
    name: Pack validation (publishable packages)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Pack validation
        run: node scripts/verify-workspace.mjs --pack
      - name: Verify clean consumer install from packed tarballs
        run: node scripts/verify-consumer-pack-all.mjs

  rust:
    name: Rust (core-wasm)
    runs-on: ubuntu-latest
    needs: install
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core-wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/core-wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo fmt --check
        working-directory: packages/core-wasm
        run: cargo fmt --check
      - name: cargo clippy (-D warnings)
        working-directory: packages/core-wasm
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        working-directory: packages/core-wasm
        run: cargo test --all-targets --all-features

  bun-readiness:
    name: Bun readiness smoke
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Bun load smoke (RFC-031 P3)
        run: bun scripts/verify-bun-load.mjs

  go:
    name: Go mirrors (build/vet/test per module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Matches the `go 1.21` directive in every packages/*/go/go.mod.
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'packages/*/go/go.sum'
      - name: Build / vet / test every Go module
        # Go mirrors are standalone modules outside the pnpm workspace; this gate
        # builds, vets and tests each (edge-can is Linux-only and compiles natively
        # on this runner).
        run: node scripts/verify-go.mjs
