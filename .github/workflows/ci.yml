name: Workspace CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  install:
    name: Frozen lockfile install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Verify working tree clean after install
        run: |
          git status --short
          test -z "$(git status --porcelain)" || (echo "install modified the working tree" && exit 1)

  supply-chain:
    name: Supply chain (dependency audit + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: '11.10.0'
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          pnpm sbom --sbom-format cyclonedx --prod --lockfile-only --split \
            --out "$RUNNER_TEMP/sbom/%s.cdx.json"
          count=$(find "$RUNNER_TEMP/sbom" -name '*.cdx.json' | wc -l)
          echo "generated $count SBOM files"
          test "$count" -ge 67 || (echo "expected at least 67 SBOMs, got $count" && exit 1)
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error

  typecheck-build:
    name: Typecheck and build (TypeScript packages)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Upload rebuilt core-wasm artifacts (provenance)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-wasm-rebuilt
          path: |
            packages/core-wasm/pkg
            packages/core-wasm/pkg-node
            packages/core-wasm/pkg-web
      - name: WASM provenance — committed pkg/pkg-node/pkg-web must match source (RFC-018 P2-5, RFC-031)
        run: |
          if ! git diff --exit-code -- packages/core-wasm/pkg packages/core-wasm/pkg-node packages/core-wasm/pkg-web; then
            echo "::error::committed core-wasm artifacts are stale; run 'npm run build' in packages/core-wasm and commit the result"
            exit 1
          fi
      - name: WASM artifact hash provenance (RFC-031 P3)
        working-directory: packages/core-wasm
        run: npm run artifacts:verify
      - name: SBOM up to date (RFC-031 P3)
        run: |
          (cd packages/core-wasm && npm run sbom:write)
          if ! git diff --exit-code -- packages/core-wasm/sbom.json; then
            echo "::error::sbom.json is stale; run 'npm run sbom:write' in packages/core-wasm and commit the result"
            exit 1
          fi
      - name: Edge size/cold-start budgets (RFC-031 G4)
        working-directory: packages/core-wasm
        run: npm run budgets:check
      - name: Typecheck + build (workspace)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: QVAC API drift audit (against real @qvac/sdk)
        run: node scripts/verify-qvac-api-drift.mjs --strict
      - name: MCP catalog parity gate
        run: node scripts/verify-mcp-index.mjs
      - name: Packed MCP consumer stdio test
        run: node scripts/test-mcp-consumer.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Custody golden-script fixtures (RFC-039)
        run: |
          for p in statechain omnia omnia-factory omnia-vtxo; do (cd "packages/$p" && npx tsc); done
          node scripts/custody-golden.mjs --check
      - name: Custody execution gate — escape branches execute (RFC-039)
        run: |
          for p in core kissvm omnia omnia-vtxo omnia-factory; do (cd "packages/$p" && npx tsc); done
          node scripts/custody-exec.mjs
      - name: State-port gate — Omnia bands below the MSHS floor (RFC-048 §12)
        run: |
          for p in statechain omnia omnia-factory omnia-vtxo; do (cd "packages/$p" && npx tsc); done
          node scripts/check-state-ports.mjs
      - name: Node-syntax gate — emitted scripts are node-canonical (RFC-048 L4)
        run: |
          for p in core kissvm statechain omnia omnia-factory omnia-vtxo; do (cd "packages/$p" && npx tsc); done
          node scripts/check-node-syntax.mjs
      - name: Composite port-allocation gate — MASH + Omnia disjoint + budget (RFC-049 §5, R-MASH-4)
        run: |
          for p in kissvm omnia omnia-factory omnia-vtxo; do (cd "packages/$p" && npx tsc); done
          node scripts/check-composite-ports.mjs
      - name: Real-VM escape gate — Rust/WASM vs TS, real signatures (RFC-048 L3/L5)
        run: |
          (cd packages/kissvm/rust && wasm-pack build --target nodejs --out-dir pkg-node)
          for p in core kissvm omnia omnia-vtxo omnia-factory; do (cd "packages/$p" && npx tsc); done
          node scripts/custody-exec-vm.mjs
      - name: Signature-parity gate — TS vs Rust verifiers (RFC-009 / RFC-033 / RFC-048)
        run: |
          for p in core kissvm; do (cd "packages/$p" && npx tsc); done
          node scripts/custody-signature-parity.mjs
      - name: P-EXIT exercise gate — unilateral exercise, Rust/WASM vs TS (RFC-050 §3)
        run: |
          for p in core kissvm; do (cd "packages/$p" && npx tsc); done
          node scripts/exercise-exec-vm.mjs
      - name: Upstream publish guard (CAN-003 / CAN-008a)
        run: node scripts/check-upstream-published.mjs
      - name: Rebuild native sqlite bindings (install uses --ignore-scripts)
        run: pnpm -r rebuild better-sqlite3
      - name: Run unit tests (workspace)
        env:
          SKIP_PREREQUISITE_BUILD: '1'
        run: node scripts/verify-workspace.mjs --test
      - name: Core async WASM entry + kernel coverage + fuzz (RFC-031 P1/P2)
        working-directory: packages/core
        run: npm run test:wasm-async
      - name: core-wasm portable web target (RFC-031 G1)
        working-directory: packages/core-wasm
        run: npm run test:web

  omnia-parity:
    name: Omnia Rust/WASM parity
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace dependencies (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Run Omnia parity tests (builds WASM first)
        working-directory: packages/omnia
        run: npm run test:parity
      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt
      - name: cargo fmt --check (omnia)
        run: cargo fmt --manifest-path packages/omnia/rust/Cargo.toml -- --check
      - name: cargo clippy (omnia, -D warnings)
        run: cargo clippy --all-targets --all-features --manifest-path packages/omnia/rust/Cargo.toml -- -D warnings
      - name: Run Omnia Rust tests
        run: cargo test --all-targets --all-features --manifest-path packages/omnia/rust/Cargo.toml

  lint:
    name: Lint + script hygiene
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Run lint gate
        run: node scripts/verify-workspace.mjs --lint
      - name: Validate npm metadata
        run: node scripts/validate-pkg-meta.mjs
      - name: Legacy surface guard (COMPATIBILITY.md)
        run: node scripts/check-legacy-surface.mjs
      - name: Validate SDK_MANIFEST sync
        run: node scripts/verify-sdk-manifest.mjs
      - name: Public claims and generated indexes (RFC-063)
        run: |
          node scripts/report-maturity.mjs
          node scripts/report-rfc-index.mjs
          node scripts/verify-public-claims.mjs
      - name: Custody conformance gate (RFC-044)
        run: node scripts/validate-custody.mjs
      - name: Wallet-adapter ⇄ connect parity gate
        run: node scripts/check-wallet-adapter-parity.mjs
      - name: Flat whole-family install guard (CAN-008)
        run: node scripts/check-family-install.mjs
      - name: storage→core DAG lint
        run: node scripts/verify-storage-dag.mjs
      - name: Wallet ⇄ connect parity audit (anti-drift)
        run: node scripts/audit-wallet-connect-parity.mjs --check
      - name: Axia public API contract tests (RFC-0002 P2, RFC-015)
        run: npx jest --config packages/connect/jest.config.cjs axia-contract

  storage-durability:
    name: Storage durable-CI (sqlite + fs + artifact conformance)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Rebuild native sqlite bindings (install uses --ignore-scripts)
        run: pnpm -r rebuild better-sqlite3
      - name: Fail if better-sqlite3 cannot run
        working-directory: packages/storage
        run: node -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3 OK')"
      - name: Run sqlite + fs KV conformance (durable gates)
        working-directory: packages/storage
        run: npx jest --testPathPatterns="sqlite-store.conformance|file-store.conformance"
      # RFC-007 Amendment A (A2): artifact durable gates. The reference backend
      # conformance is `runBackendConformance` in @totemsdk/storage (LocalFileBackend);
      # the Edge cache and ProofGraph consume it rather than re-declaring a suite.
      - name: Reference artifact backend conformance (LocalFileBackend)
        working-directory: packages/storage
        run: npx jest --testPathPatterns="artifact-store" --runInBand
      - name: Persistence helper contract (assertPersistence)
        working-directory: packages/storage
        run: npx jest persistence --runInBand
      - name: Edge artifact cache conformance (first consumer)
        working-directory: packages/edge-adapters
        run: npx jest artifact-cache --runInBand
      - name: ProofGraph evidence conformance (reference ArtifactStore consumer)
        working-directory: packages/proofgraph
        run: npx jest evidence --runInBand

  pack:
    name: Pack validation (publishable packages)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build Omnia WASM artifacts (declared in files)
        working-directory: packages/omnia
        run: npm run build:wasm
      - name: Strip wasm-pack generated .gitignore files
        run: node ../../scripts/clean-wasm-output-ignores.mjs
        working-directory: packages/omnia
      - name: Pack validation
        run: node scripts/verify-workspace.mjs --pack
      - name: Verify clean consumer install from packed tarballs
        run: node scripts/verify-consumer-pack-all.mjs

  rust:
    name: Rust (core-wasm)
    runs-on: ubuntu-latest
    needs: install
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core-wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/core-wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo fmt --check
        working-directory: packages/core-wasm
        run: cargo fmt --check
      - name: cargo clippy (-D warnings)
        working-directory: packages/core-wasm
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        working-directory: packages/core-wasm
        run: cargo test --all-targets --all-features

  bun-readiness:
    name: Bun readiness smoke
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup filtered workspace
        uses: ./.github/actions/setup-pnpm
      - name: Setup Rust and WASM toolchain
        uses: ./.github/actions/setup-rust-wasm
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: npm run build
      - name: Build workspace (dependency order)
        run: node scripts/verify-workspace.mjs --typecheck
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Bun load smoke (RFC-031 P3)
        run: bun scripts/verify-bun-load.mjs

  go:
    name: Go mirrors (build/vet/test per module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Matches the `go 1.21` directive in every packages/*/go/go.mod.
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'packages/*/go/go.sum'
      - name: Build / vet / test every Go module
        # Go mirrors are standalone modules outside the pnpm workspace; this gate
        # builds, vets and tests each (edge-can is Linux-only and compiles natively
        # on this runner).
        run: node scripts/verify-go.mjs
