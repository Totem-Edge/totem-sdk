name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  install:
    name: Frozen lockfile install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify working tree clean after install
        run: |
          git status --short
          test -z "$(git status --porcelain)" || (echo "install modified the working tree" && exit 1)

  typecheck-build:
    name: Typecheck and build (TypeScript packages)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          npm run build
      - name: Typecheck + build (workspace)
        run: node scripts/verify-workspace.mjs --typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          npm run build
      - name: Run unit tests (workspace)
        run: node scripts/verify-workspace.mjs --test

  lint:
    name: Lint + script hygiene
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Run lint gate
        run: node scripts/verify-workspace.mjs --lint

  pack:
    name: Pack validation (publishable packages)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build core-wasm (prerequisite)
        working-directory: packages/core-wasm
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          npm run build
      - name: Pack validation
        run: node scripts/verify-workspace.mjs --pack

  rust:
    name: Rust (core-wasm)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core-wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/core-wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo fmt --check
        working-directory: packages/core-wasm
        run: cargo fmt --check
      - name: cargo clippy (-D warnings)
        working-directory: packages/core-wasm
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        working-directory: packages/core-wasm
        run: cargo test --all-targets --all-features
