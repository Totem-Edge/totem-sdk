name: Rust Core CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'packages/core-wasm/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/core-wasm/**'
      - '.github/workflows/rust-core.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-D warnings'
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core-wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/core-wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run unit tests
        working-directory: packages/core-wasm
        run: cargo test --lib

      - name: Run Java parity tests
        working-directory: packages/core-wasm
        run: cargo test --test java_parity

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core-wasm/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('packages/core-wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        working-directory: packages/core-wasm
        run: cargo clippy --all-targets -- -D warnings

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core-wasm/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('packages/core-wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build WASM (bundler target)
        working-directory: packages/core-wasm
        run: wasm-pack build --target bundler --out-dir pkg

      - name: Build WASM (nodejs target)
        working-directory: packages/core-wasm
        run: wasm-pack build --target nodejs --out-dir pkg-node

      - name: Prepare WASM package assets
        working-directory: packages/core-wasm
        run: node scripts/prepare-publish-assets.mjs

      - name: Check WASM size
        working-directory: packages/core-wasm
        run: |
          SIZE=$(wc -c < pkg/totemsdk_core_wasm_bg.wasm)
          echo "WASM size: ${SIZE} bytes"
          if [ "$SIZE" -gt 524288 ]; then
            echo "::warning::WASM binary exceeds 512KB (${SIZE} bytes)"
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-pkg-${{ github.sha }}
          path: |
            packages/core-wasm/pkg/
            packages/core-wasm/pkg-node/
          retention-days: 7

  wasm-test:
    name: WASM Tests (Node.js)
    runs-on: ubuntu-latest
    needs: wasm-build
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core-wasm/target
          key: ${{ runner.os }}-cargo-wasm-test-${{ hashFiles('packages/core-wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-test-

      - name: Run wasm-pack tests
        working-directory: packages/core-wasm
        run: wasm-pack test --node

  sdk-integration:
    name: SDK Integration Tests
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Build WASM
        working-directory: packages/core-wasm
        run: |
          wasm-pack build --target bundler --out-dir pkg
          wasm-pack build --target nodejs --out-dir pkg-node

      - name: Prepare WASM package assets
        working-directory: packages/core-wasm
        run: node scripts/prepare-publish-assets.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        working-directory: packages/core
        run: npx jest --no-coverage

      - name: Run wots-lease tests
        working-directory: packages/wots-lease
        run: npx jest --no-coverage

      - name: Run txpow tests
        working-directory: packages/txpow
        run: npx jest --no-coverage
