<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem - Transaction Approval</title>
    <style>
        :root {
            --bg-base: #000;
            --bg-subtle: #1a1a1a;
            --bg-elevated: #111;
            --text-primary: #fff;
            --text-muted: #888;
            --accent: #00D9B5;
            --accent-muted: rgba(0, 217, 181, 0.1);
            --border-default: #333;
            --border-subtle: #222;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: var(--bg-base);
            color: var(--text-primary);
            width: 100%;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-default);
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-subtle);
            border: 2px solid var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-title {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 4px 0;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 11px;
            margin: 0;
        }

        .origin-box {
            background: var(--accent-muted);
            border: 1px solid var(--accent);
            padding: 10px;
            margin-bottom: 16px;
        }

        .label {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .origin-value {
            color: var(--accent);
            font-size: 12px;
            word-break: break-all;
        }

        .amount-box {
            background: var(--bg-elevated);
            border: 2px solid var(--text-primary);
            padding: 16px;
            margin-bottom: 16px;
        }

        .amount-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .amount-token {
            font-size: 14px;
            color: var(--accent);
        }

        .token-id {
            color: var(--text-muted);
            font-size: 10px;
            word-break: break-all;
            margin-top: 4px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 11px;
        }

        .detail-value {
            color: var(--text-primary);
            font-size: 11px;
            text-align: right;
            max-width: 200px;
            word-break: break-all;
        }

        .intent-badge {
            text-transform: uppercase;
            background: var(--bg-subtle);
            padding: 2px 8px;
            border: 1px solid var(--border-default);
            font-size: 11px;
        }

        .address-box {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .address-value {
            font-family: monospace;
            color: var(--text-primary);
            font-size: 11px;
            word-break: break-all;
            background: var(--bg-elevated);
            padding: 8px;
            border: 1px solid var(--border-default);
            margin-top: 6px;
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            padding: 10px;
            margin: 16px 0;
            font-size: 10px;
            color: var(--warning);
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            padding: 10px;
            margin: 16px 0;
            font-size: 10px;
            color: var(--error);
        }

        .actions {
            display: flex;
            gap: 8px;
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reject-btn {
            border: 2px solid var(--text-primary);
            background: transparent;
            color: var(--text-primary);
        }

        .approve-btn {
            border: 2px solid var(--accent);
            background: var(--accent);
            color: #000;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">💸</div>
        <div>
            <h1 class="header-title">SEND TRANSACTION</h1>
            <p class="header-subtitle">Review and approve this transaction</p>
        </div>
    </div>

    <div class="origin-box">
        <div class="label">REQUESTING SITE</div>
        <div class="origin-value" id="origin">Loading...</div>
    </div>

    <div class="amount-box">
        <div class="label">AMOUNT</div>
        <div class="amount-value">
            <span id="amount">0</span> <span class="amount-token" id="token-name">MINIMA</span>
        </div>
        <div class="token-id" id="token-id-display" style="display: none;">
            Token ID: <span id="token-id"></span>
        </div>
    </div>

    <div class="detail-row">
        <span class="detail-label">Intent</span>
        <div style="text-align:right;">
            <span class="intent-badge" id="intent-label">SEND</span>
            <div id="intent-caption" style="font-size:9px;color:var(--text-muted);margin-top:4px;max-width:200px;line-height:1.3;"></div>
        </div>
    </div>

    <div class="address-box">
        <div class="label">RECIPIENT ADDRESS</div>
        <div class="address-value" id="to-address">Loading...</div>
    </div>

    <div class="detail-row">
        <span class="detail-label">Network Fee</span>
        <span class="detail-value" style="color: var(--text-muted); font-style: italic;">Estimated at broadcast</span>
    </div>

    <div class="warning-box">
        ⚠️ This transaction will consume a one-time WOTS signature from your wallet
    </div>

    <div id="validation-status"></div>

    <div class="actions">
        <button class="reject-btn" id="reject-btn">REJECT</button>
        <button class="approve-btn" id="approve-btn">APPROVE</button>
    </div>

    <script src="tx-approval.js"></script>
</body>
</html>
